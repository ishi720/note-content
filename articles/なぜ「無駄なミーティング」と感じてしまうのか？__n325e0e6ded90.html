  <h1>なぜ「無駄なミーティング」と感じてしまうのか？</h1>
  <p><a href="https://note.com/notes/n325e0e6ded90" target="_blank">元記事を開く</a> ／ 公開日: 2026-01-01 ／ いいね: 4</p>
  <hr>
  
はじめに
皆さんの職場では、無駄なミーティングが行われていませんか？どんなミーティングが無駄だと思いますか？

この記事では、無駄なミーティングとは何か、そしてどう改善できるかを私なりにまとめました。

無駄なミーティングの正体さっそくですが、なぜ無駄なミーティングだと感じるのか。それは、あなたがそのミーティングに不満を持っているからです。

しかし、あなたが不満に思っているミーティングを、他のメンバーは良いミーティングだと思っている可能性があります。逆に、あなたが良いと思
